<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Video Downloader</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="p-4 text-center border-b border-slate-800 bg-slate-900/50 backdrop-blur-md">
        <h1 class="text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">
            <i class="fa-solid fa-cloud-arrow-down mr-2"></i>AIO Video Downloader
        </h1>
        <p class="text-xs text-slate-400 mt-1">Download videos from TikTok, Instagram, YouTube & more instantly.</p>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-950/70 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-xl">
            
            <!-- Input Form -->
            <div class="space-y-4">
                <div>
                    <label for="videoUrl" class="block text-sm font-medium text-slate-300 mb-1">Paste Video URL</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-link"></i>
                        </span>
                        <input type="url" id="videoUrl" placeholder="https://www.tiktok.com/@..." 
                            class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 text-sm">
                    </div>
                </div>

                <button id="fetchBtn" onclick="fetchVideoData()" 
                    class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-cyan-500/20 flex items-center justify-center space-x-2 text-sm">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span id="btnText">Fetch Video</span>
                </button>
            </div>

            <!-- Loading Spinner -->
            <div id="loader" class="hidden text-center py-8">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-cyan-400"></i>
                <p class="text-xs text-slate-400 mt-2">Fetching download links, please wait...</p>
            </div>

            <!-- Error Message -->
            <div id="errorBox" class="hidden mt-4 p-3 bg-red-950/50 border border-red-800 text-red-200 rounded-xl text-xs text-center"></div>

            <!-- Result Section -->
            <div id="resultSection" class="hidden mt-6 space-y-4 border-t border-slate-800 pt-4">
                <div class="flex items-center space-x-3 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                    <img id="resThumbnail" src="" alt="Thumbnail" class="w-16 h-16 object-cover rounded-lg border border-slate-700">
                    <div class="overflow-hidden flex-1">
                        <h3 id="resTitle" class="text-sm font-medium text-slate-200 truncate">Video Title</h3>
                        <p class="text-xs text-slate-400 mt-05">Author: <span id="resAuthor" class="text-cyan-400"></span></p>
                    </div>
                </div>

                <!-- Download Options / Links -->
                <div>
                    <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Available Downloads</h4>
                    <div id="downloadLinks" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <!-- Dynamically populated download buttons -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="p-4 text-center text-xs text-slate-500 border-t border-slate-800 bg-slate-900/50">
        Powered by RapidAPI &bull; Built with Tailwind CSS
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const RAPIDAPI_KEY = "29f8c3b79amshc7b9755d426320dp1b94fajsn62b1821d47db";
        const RAPIDAPI_HOST = "social-download-all-in-one.p.rapidapi.com";

        async function fetchVideoData() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loader = document.getElementById('loader');
            const errorBox = document.getElementById('errorBox');
            const resultSection = document.getElementById('resultSection');
            const fetchBtn = document.getElementById('fetchBtn');
            const btnText = document.getElementById('btnText');

            // Validation
            if (!urlInput) {
                showError("Please enter a valid video URL.");
                return;
            }

            // Reset UI
            errorBox.classList.add('hidden');
            resultSection.classList.add('hidden');
            loader.classList.remove('hidden');
            fetchBtn.disabled = true;
            btnText.innerText = "Processing...";

            try {
                const response = await fetch(`https://${RAPIDAPI_HOST}/v1/social/autolink`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-rapidapi-host': RAPIDAPI_HOST,
                        'x-rapidapi-key': RAPIDAPI_KEY
                    },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error("Failed to fetch media. Please check the URL and try again.");
                }

                // Populate details
                document.getElementById('resThumbnail').src = data.thumbnail || 'https://via.placeholder.com/150';
                document.getElementById('resTitle').innerText = data.title || 'Untitled Video';
                document.getElementById('resAuthor').innerText = data.author || 'Unknown';

                // Populate Download links
                const downloadContainer = document.getElementById('downloadLinks');
                downloadContainer.innerHTML = '';

                if (data.medias && data.medias.length > 0) {
                    data.medias.forEach((media, index) => {
                        let qualityLabel = media.quality || `Option ${index + 1}`;
                        let fileExt = media.extension || 'mp4';
                        let mediaType = media.type || 'video';
                        
                        let icon = mediaType === 'audio' ? 'fa-music' : 'fa-download';
                        
                        const linkItem = document.createElement('a');
                        linkItem.href = media.url;
                        linkItem.target = '_blank';
                        linkItem.download = '';
                        linkItem.className = "flex items-center justify-between p-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl transition duration-150 text-xs group";
                        linkItem.innerHTML = `
                            <div class="flex items-center space-x-2 truncate">
                                <i class="fa-solid ${icon} text-cyan-400"></i>
                                <span class="text-slate-300 group-hover:text-cyan-300 font-medium capitalize truncate">${mediaType} (${qualityLabel})</span>
                            </div>
                            <span class="bg-cyan-500/10 text-cyan-400 px-2 py-1 rounded-lg text-[10px] uppercase font-semibold">Download</span>
                        `;
                        downloadContainer.appendChild(linkItem);
                    });
                } else {
                    downloadContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-2">No download streams available.</p>';
                }

                resultSection.classList.remove('hidden');

            } catch (err) {
                showError(err.message || "An error occurred while connecting to the API.");
            } finally {
                loader.classList.add('hidden');
                fetchBtn.disabled = false;
                btnText.innerText = "Fetch Video";
            }
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.innerText = message;
            errorBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
